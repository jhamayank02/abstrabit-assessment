<!doctype html><html><head><meta charset="utf-8"><title>Workspace Assistant</title><style>body{font:15px system-ui;max-width:1100px;margin:30px auto;color:#17202a}header{display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-columns:240px 1fr;gap:24px}.card{border:1px solid #ddd;border-radius:10px;padding:16px;margin:10px 0}button{padding:9px 12px;border:0;border-radius:6px;background:#2563eb;color:white;cursor:pointer}input{padding:9px;border:1px solid #bbb;border-radius:6px}.muted{color:#667085}.msg{white-space:pre-wrap;padding:10px;background:#f5f7fb;border-radius:7px;margin:8px 0}</style></head><body><header><h1>Workspace Assistant</h1><span class="muted">Shared vector store · filtered retrieval</span></header><main><aside class=card><h3>Workspaces</h3><div id=ws></div><hr><input id=newws placeholder="New workspace"><button onclick=createWs>Create</button></aside><section><div class=card><h3 id=title>Loading…</h3><input type=file id=file><button onclick=upload>Upload</button><div id=docs class=muted></div></div><div class=card><div id=chat></div><input id=q style="width:75%" placeholder="Ask about this workspace…"><button onclick=ask>Ask</button><p class=muted>Try: “What is the roadmap?” or “Create a task: review launch plan”.</p></div><div class=card><h3>Tool call log</h3><div id=tools class=muted></div></div></section></main><script>let active;const $=x=>document.getElementById(x);async function api(u,o){return fetch(u,o).then(r=>r.json())}async function load(){let a=await api('/api/workspaces');$('ws').innerHTML=a.map(x=>`<p><button onclick="selectWs('${x.id}','${x.name}')">${x.name}</button></p>`).join('');selectWs(a[0].id,a[0].name)}async function selectWs(id,name){active=id;$('title').textContent=name;let d=await api('/api/workspaces/'+id+'/documents');$('docs').innerHTML='<b>Documents:</b> '+(d.map(x=>x.name).join(', ')||'none');let a=await api('/api/workspaces/'+id+'/activity');$('chat').innerHTML=a.messages.map(x=>`<div class=msg><b>${x.role}:</b> ${x.content}</div>`).join('');$('tools').innerHTML=a.tools.map(x=>`<div class=msg>${x.tool} ${x.arguments} → ${x.result}</div>`).join('')}async function upload(){if(!$('file').files[0])return;let f=new FormData();f.append('file',$('file').files[0]);await api('/api/workspaces/'+active+'/documents',{method:'POST',body:f});selectWs(active,$('title').textContent)}async function ask(){let q=$('q').value;if(!q)return;await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace_id:active,question:q})});$('q').value='';selectWs(active,$('title').textContent)}async function createWs(){let name=$('newws').value;if(name)await api('/api/workspaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});load()}load()</script></body></html>
